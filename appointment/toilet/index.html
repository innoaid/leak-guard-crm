<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Leak Guard — Toilet Team Availability</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;color:#111827;font-size:15px;padding:0 0 48px}
.hdr{background:#2D2A6E;color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:12px;opacity:.85;margin-top:2px}
.staff{background:#EEF2FF;border-bottom:1px solid #C7D2FE;color:#2D2A6E;padding:9px 16px;font-size:12.5px;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:12px;font-weight:700;color:#4B5563;margin:8px 0 4px}
input{width:100%;border:1px solid #D1D5DB;border-radius:9px;padding:11px;font-size:15px;font-family:inherit;background:#fff}
.go{margin-top:12px;width:100%;background:#10B981;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:800;cursor:pointer}
.go.sec{background:#2D2A6E}
.daycard{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 13px;margin-bottom:10px}
.dayh{font-size:14px;font-weight:800;margin-bottom:9px}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1.5px solid #A7F3D0;background:#ECFDF5;color:#065F46;border-radius:9px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer}
.slot:active{transform:scale(.97)}
.spin,.empty{text-align:center;color:#6b7280;padding:40px 20px;font-size:14px}
.sect{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#374151;margin:6px 2px 10px}
.done{text-align:center;padding:40px 22px}
.done .ok{width:60px;height:60px;border-radius:50%;background:#D1FAE5;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px}
.done h2{font-size:19px;font-weight:800;margin-bottom:6px}
.done p{color:#6b7280;font-size:14px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .25s;max-width:90%;text-align:center}
.toast.on{opacity:1}.toast.err{background:#DC2626}.toast.ok{background:#059669}
</style>
</head>
<body>
<div class="hdr">
  <h1>🚽 Toilet Team — Availability</h1>
  <div class="sub">Check open slots &amp; book — KL toilet team calendar</div>
</div>
<div class="staff" id="staff" style="display:none">🎧 Booking recorded as <b><span id="staffName"></span></b></div>
<div class="wrap" id="wrap">
  <div class="panel" id="form">
    <label>Customer Name <span style="color:#dc2626">*</span></label>
    <input id="fName" type="text" placeholder="Customer full name">
    <label>WhatsApp Phone <span style="color:#dc2626">*</span></label>
    <input id="fPhone" type="tel" inputmode="tel" placeholder="e.g. 0123456789">
    <button class="go sec" onclick="check()">🔍 Check toilet-team availability</button>
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// Standalone toilet-team availability + booking for telemarketers — skips the
// customer express form. Reads the toilet calendar via lg-availability, books
// via lg-booking (team=TOILET). Ensures the CRM lead exists (expressLead upsert)
// before booking so Status/appointment reflect, and records who booked (?by=).
var AVAILABILITY_URL = 'https://leakguard.app.n8n.cloud/webhook/lg-availability';
var BOOKING_URL = 'https://leakguard.app.n8n.cloud/webhook/lg-booking';
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxjWM_kuuFvXhgPgoSEb4hycnIUHuxdOkYTfSWEhNPm7vrOYzZ6vFgQw-qA55Dv3mLB2Q/exec';
var SHARED_SECRET = 'ABC';
var TEAM = 'TOILET';
var SLOT_LABELS = {
  1: {label:'9:00 AM', full:'9:00 AM - 10:00 AM'},
  2: {label:'10:30 AM', full:'10:30 AM - 11:30 AM'},
  3: {label:'2:00 PM', full:'2:00 PM - 3:00 PM'},
  4: {label:'3:30 PM', full:'3:30 PM - 4:30 PM'}
};
var FULL_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var BY = (new URLSearchParams(location.search).get('by') || '').trim();
if (BY) { document.getElementById('staffName').textContent = BY; document.getElementById('staff').style.display = 'block'; }

var AVAIL = {};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
function toast(msg, kind){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast on '+(kind||''); setTimeout(function(){ t.className='toast '+(kind||''); },2800); }
function digits(s){ return String(s||'').replace(/\D/g,''); }

async function check(){
  var name = document.getElementById('fName').value.trim();
  var phone = digits(document.getElementById('fPhone').value);
  if (!name){ toast('Enter the customer name','err'); return; }
  if (phone.length < 9){ toast('Enter a valid WhatsApp number','err'); return; }
  var list = document.getElementById('list');
  list.innerHTML = '<div class="spin">Loading toilet-team availability…</div>';
  try {
    var url = AVAILABILITY_URL + '?phone=' + encodeURIComponent(phone) + '&group=&team=' + encodeURIComponent(TEAM);
    var data = await (await fetch(url)).json();
    if (data.error === 'calendar_unavailable'){ list.innerHTML = '<div class="empty" style="color:#DC2626">⚠ '+esc(data.message||'Calendar temporarily unavailable. Try again in a minute.')+'</div>'; return; }
    AVAIL = data.availability || {};
    renderDates();
  } catch(e){ list.innerHTML = '<div class="empty" style="color:#DC2626">⚠ '+esc(e.message||e)+'</div>'; }
}

function renderDates(){
  var list = document.getElementById('list');
  var keys = Object.keys(AVAIL).filter(function(k){ return AVAIL[k] && AVAIL[k].length; }).sort();
  if (!keys.length){ list.innerHTML = '<div class="empty">No open toilet-team slots in the coming weeks.</div>'; return; }
  var html = '<div class="sect">Available toilet-team slots — tap to book</div>';
  keys.forEach(function(k){
    var dt = new Date(k + 'T12:00:00');
    var head = FULL_DAYS[dt.getDay()] + ', ' + dt.getDate() + ' ' + SHORT_MONTHS[dt.getMonth()];
    html += '<div class="daycard"><div class="dayh">'+esc(head)+'</div><div class="slots">' +
      AVAIL[k].map(function(sid){ var s=SLOT_LABELS[sid]; return s ? '<button class="slot" onclick="book(\''+k+'\','+sid+')">'+esc(s.full)+'</button>' : ''; }).join('') +
      '</div></div>';
  });
  list.innerHTML = html;
}

async function book(date, slot){
  var name = document.getElementById('fName').value.trim();
  var phone = digits(document.getElementById('fPhone').value);
  var s = SLOT_LABELS[slot];
  if (!confirm('Book ' + name + ' for a TOILET site visit?\n\n' + date + ' · ' + s.full)) return;
  toast('Booking…');
  try {
    // 1) ensure the CRM lead exists + record who booked (no state → don't clobber location)
    try { await fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'expressLead', secret:SHARED_SECRET, name:name, phone:phone, by:BY }) }); } catch(_e){}
    // 2) book the toilet-team slot
    var res = await (await fetch(BOOKING_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ phone:phone, group:'', name:name, date:date, slot:slot, action:'new', team:TEAM, by:BY }) })).json();
    if (res && res.success){
      var dt = new Date(date + 'T12:00:00');
      document.getElementById('wrap').innerHTML =
        '<div class="done"><div class="ok">✅</div><h2>Booked!</h2>' +
        '<p><b>'+esc(name)+'</b><br>'+FULL_DAYS[dt.getDay()]+', '+dt.getDate()+' '+SHORT_MONTHS[dt.getMonth()]+' '+dt.getFullYear()+'<br>'+esc(s.full)+'<br>Toilet Team</p>' +
        '<button class="go" style="max-width:280px;margin:20px auto 0" onclick="location.href=location.pathname+(BY?(\'?by=\'+encodeURIComponent(BY)):\'\')">Book another customer</button></div>';
      window.scrollTo(0,0);
    } else if (res && res.error === 'slot_taken'){
      toast('That slot was just taken — pick another','err'); check();
    } else {
      toast('Failed: ' + ((res && (res.message||res.error)) || 'error'),'err');
    }
  } catch(e){ toast('Network error — try again','err'); }
}
</script>
</body>
</html>
