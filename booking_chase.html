<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Leak Guard — Booking Chase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;color:#111827;font-size:15px;padding:0 0 48px}
.hdr{background:#2D2A6E;color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:12px;opacity:.85;margin-top:2px}
.hdr .tools{margin-top:10px;display:flex;gap:8px}
.hdr .tools button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
.hdr .tools button.on{background:#fff;color:#2D2A6E;border-color:#fff}
.search{margin-top:10px;width:100%;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:9px 12px;font-size:14px;background:rgba(255,255,255,.14);color:#fff;font-family:inherit}
.search::placeholder{color:rgba(255,255,255,.7)}
.search:focus{outline:none;background:#fff;color:#111827}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.sect-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#374151;padding:4px 2px 10px}
.card{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #10B981;border-radius:12px;padding:13px;margin-bottom:11px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.warm{border-left-color:#F59E0B}
.card.cold{border-left-color:#9CA3AF}
.card.snz{opacity:.5;border-left-color:#A5B4FC;background:#FbFbFe}
.card.gone{opacity:.4;pointer-events:none}
.cname{font-size:16px;font-weight:800}
.badges{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.b-status{background:#EEF2FF;color:#2D2A6E}
.b-loc{background:#F3F4F6;color:#374151}
.b-wait{background:#ECFDF5;color:#065F46}
.b-wait.warm{background:#FEF3C7;color:#92400E}
.b-wait.cold{background:#F3F4F6;color:#6B7280}
.b-snz{background:#E0E7FF;color:#3730A3}
.b-src{background:#F5F3FF;color:#6D28D9}
.b-ret{background:#FEF3C7;color:#92400E}
.comp{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:7px;border:1px solid}
.chip.ok{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.chip.no{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.meta{font-size:12.5px;color:#6b7280;margin-top:7px;line-height:1.5}
.meta b{color:#374151}
.hist{margin-top:8px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:8px}
.hist-h{font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.hist-row{font-size:12px;color:#374151;line-height:1.5;padding:2px 0;border-top:.5px solid #F3F4F6}
.hist-row:first-of-type{border-top:none}
.hist-d{font-weight:700;color:#6B7280}
.links{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;color:#2563EB;text-decoration:none;border:1px solid #BFDBFE;border-radius:8px;padding:6px 12px;background:#EFF6FF}
.acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.abtn{flex:1;min-width:calc(50% - 4px);border:none;border-radius:9px;padding:10px 8px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.abtn.book{background:#10B981}.abtn.edit{background:#2563EB}.abtn.fu{background:#F59E0B}.abtn.nt{background:#6B7280}.abtn.cancel{background:#EF4444}
.abtn.book.alt{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7}
.cancel-p{background:#FEF2F2;border:1px solid #FECACA}
.mv{margin-top:6px;display:flex;gap:8px}
.mv select{flex:1;border:1px solid #D1D5DB;border-radius:9px;padding:9px;font-size:13.5px;background:#fff;font-family:inherit}
.mv button{border:none;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:700;color:#fff;background:#7C3AED;cursor:pointer}
.panel{display:none;margin-top:9px;border-radius:10px;padding:10px}
.panel.open{display:block}
.edit-p{background:#EFF6FF;border:1px solid #BFDBFE}
.fu-p{background:#FFFBEB;border:1px solid #FDE68A}
.nt-p{background:#F3F4F6;border:1px solid #E5E7EB}
.panel label{font-size:12px;font-weight:700;color:#4B5563;display:block;margin:6px 0 4px}
.panel input,.panel textarea{width:100%;border:1px solid #D1D5DB;border-radius:8px;padding:9px;font-size:14px;font-family:inherit;background:#fff}
.panel .go{color:#fff;border:none;border-radius:8px;padding:10px;width:100%;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;background:#10B981}
.edit-p .go{background:#2563EB}
.nophone{margin-top:22px}
.nophone .card{border-left-color:#EF4444;opacity:.85}
.allclear{text-align:center;color:#059669;padding:60px 20px;font-size:16px;font-weight:700}
.spin{text-align:center;color:#6b7280;padding:60px 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .25s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.toast.err{background:#DC2626}.toast.ok{background:#059669}
/* Report view */
.rep-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.rep-ctrl button{background:#EEF2FF;color:#2D2A6E;border:1px solid #C7D2FE;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.rep-ctrl button.on{background:#2D2A6E;color:#fff;border-color:#2D2A6E}
.rep-ctrl input[type=date]{border:1px solid #D1D5DB;border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;background:#fff}
.tiles{display:flex;gap:10px;margin-bottom:16px}
.tile{flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tile .n{font-size:26px;font-weight:800;line-height:1}
.tile .l{font-size:11.5px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.3px;margin-top:5px}
.tile.call .n{color:#2563EB}.tile.book .n{color:#059669}.tile.conf .n{color:#7C3AED}
.rtbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:18px}
.rtbl th,.rtbl td{padding:9px 10px;font-size:13px;text-align:left;border-top:1px solid #F3F4F6}
.rtbl th{background:#F9FAFB;font-size:11px;font-weight:800;color:#6b7280;text-transform:uppercase;letter-spacing:.3px;border-top:none}
.rtbl td.num,.rtbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.rtbl tr td:first-child{font-weight:700}
.day-h{font-size:13px;font-weight:800;color:#374151;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.day-h .s{font-size:12px;font-weight:600;color:#6b7280}
.evt{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px 11px;margin-bottom:7px}
.evt .t{font-size:12px;font-weight:700;color:#6b7280;font-variant-numeric:tabular-nums;min-width:38px}
.evt .k{font-size:15px;min-width:20px;text-align:center}
.evt .b{flex:1;min-width:0}
.evt .nm{display:block;font-size:13.5px;font-weight:700;color:#111827}
.evt .sub{display:block;font-size:12px;color:#6b7280;margin-top:2px;word-break:break-word}
.evt .who{font-size:11px;font-weight:700;color:#2D2A6E;background:#EEF2FF;border-radius:6px;padding:1px 7px;white-space:nowrap}
.evt.b-book{border-left:3px solid #10B981}.evt.b-call{border-left:3px solid #2563EB}
.conf-tag{display:inline-block;font-size:10.5px;font-weight:700;color:#5B21B6;background:#EDE9FE;border-radius:6px;padding:1px 6px;margin-left:6px}
.src-tag{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px}
.src-tag.express{color:#065F46;background:#D1FAE5}.src-tag.chase{color:#3730A3;background:#E0E7FF}
.dup-tag{display:inline-block;font-size:10px;font-weight:700;color:#92400E;background:#FEF3C7;border-radius:6px;padding:1px 6px;margin-left:6px}
.evt.dup{opacity:.55}
.rep-legend{font-size:12px;color:#6b7280;margin:-6px 2px 14px;line-height:1.5}
</style>
</head>
<body>
<div class="hdr">
  <h1 id="hTitle">📞 Booking Chase</h1>
  <div class="sub" id="hSub">Loading…</div>
  <div class="tools">
    <button data-win="7" onclick="setWin(7)">🔥 ≤7d</button>
    <button data-win="14" class="on" onclick="setWin(14)">≤14d</button>
    <button data-win="30" onclick="setWin(30)">≤30d</button>
    <button data-win="999" onclick="setWin(999)">All</button>
    <button onclick="refreshView()">↻</button>
    <button id="repBtn" onclick="setView('report')" style="margin-left:auto">📊 Report</button>
  </div>
  <input class="search" id="q" type="search" placeholder="🔍 Search name, phone, area…" oninput="setSearch(this.value)">
</div>
<div class="wrap" id="list"><div class="spin">Scanning…</div></div>
<div class="wrap" id="report" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
// Un-booked leads > 24h old that still need a site visit booked. Read-only list
// via public gviz; every write reuses an already-live Apps Script action:
//   book  -> the /appointment/?p= booking page   (availability + LG-Booking)
//   edit  -> updateLeadDetails                    (fill missing name/addr/etc)
//   note/follow-up -> logScanNote + phaseScanState (notes + snooze, round 134/137)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjWM_kuuFvXhgPgoSEb4hycnIUHuxdOkYTfSWEhNPm7vrOYzZ6vFgQw-qA55Dv3mLB2Q/exec';
const SECRET = 'ABC';
const SHEET_ID = '1FnuiZcOSy5UMQpW81I7qtU6a7NGlnHtJbH2EkVM7PLQ';
const SHEET_NAME = 'Leak Guard Leads';
const BOOK_URL = 'https://leakguard.my/appointment/';
const BY = (new URLSearchParams(location.search).get('by') || 'Chase').trim();

// Telemarketers who each get their OWN split of the un-booked pool (so they
// never call the same customer). Open booking_chase.html?by=Ivan / ?by=Eric.
// Any other 'by' (Manager, blank, Chase) sees EVERY un-booked lead (admin view).
const TELEMARKETERS = ['Ivan','Eric'];
function assignedTo(phone){
  const d=last8(phone); if(!d) return '';
  let s=0; for(let i=0;i<d.length;i++) s+=d.charCodeAt(i);   // stable per phone
  return TELEMARKETERS[s % TELEMARKETERS.length];
}
function myIdx(){ return TELEMARKETERS.map(function(t){return t.toLowerCase();}).indexOf(BY.toLowerCase()); }
function myLead(phone){ const i=myIdx(); return i===-1 ? true : (assignedTo(phone)===TELEMARKETERS[i]); }

// Only these pre-booking statuses need chasing (booked / dead are excluded).
const OPEN_STATUSES = ['New Lead','Pending Invitation','Pending Site Visit'];
const AGE_MIN_H = 0;   // show ALL un-booked leads (no min age; fresh ones included)
// Forward phases a chase lead can be shifted to when the client skips the site
// inspection (Pending QT = go straight to quotation). All leave the chase list.
const MOVE_PHASES = ['Pending QT','Quotation Sent','Pending I.Date','Pending Downpayment'];

let DATA = [];      // actionable (has phone)
let NOPHONE = [];   // matched but no phone — can't call/book
let STATE = {};     // phaseScanState: last8(phone) -> {notes:[{date,by,note}], snoozeUntil}
let SEARCH = '';
let WIN = 14;       // age window in days (999 = all). Default 14d: the actionable
                    // chase window — most eligible leads older than that are cold.

function setWin(d){ WIN=d; document.querySelectorAll('.hdr .tools button[data-win]').forEach(function(b){ b.classList.toggle('on', +b.dataset.win===d); }); render(); }
function winMatch(c){ if(WIN>=999) return true; return c.ageH!=null && c.ageH <= WIN*24; }

function toast(msg, kind){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast on '+(kind||''); setTimeout(function(){ t.className='toast '+(kind||''); },2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
function todayStr(){ return new Date(Date.now()+8*3600*1000).toISOString().slice(0,10); }
function tomorrowStr(){ return new Date(Date.now()+8*3600*1000+86400000).toISOString().slice(0,10); }
function last8(p){ p=String(p||'').replace(/\D/g,''); return p.slice(-8); }
// The public gviz read can lag a minute or two behind a write, so a just-
// cancelled card can flicker back on the next refresh. Suppress it locally for
// 10 min so it stays gone until the sheet read catches up.
function suppress(phone){ try{ const m=JSON.parse(localStorage.getItem('chaseSuppress')||'{}'); m[last8(phone)]=Date.now()+600000; localStorage.setItem('chaseSuppress', JSON.stringify(m)); }catch(_e){} }
function isSuppressed(phone){ try{ const m=JSON.parse(localStorage.getItem('chaseSuppress')||'{}'); const e=m[last8(phone)]; return !!(e && e>Date.now()); }catch(_e){ return false; } }
function cardState(c){ return STATE[last8(c.phone)] || null; }
function snoozed(c){ const s=cardState(c); return !!(s && s.snoozeUntil && s.snoozeUntil > todayStr()); }
function waitLabel(h){ if(h==null) return '?'; const d=Math.floor(h/24); return d>=1 ? d+'d' : Math.round(h)+'h'; }

async function api(action, payload){
  const r = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(Object.assign({action:action, secret:SECRET}, payload)) });
  return r.json();
}
async function gvizRows(){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(SHEET_NAME)+'&nocache='+Date.now();
  const txt=await (await fetch(url)).text();
  const m=txt.match(/setResponse\(([\s\S]*)\)/); if(!m) return [];
  const j=JSON.parse(m[1]); const cols=j.table.cols.map(function(c){return (c.label||'').trim();});
  return (j.table.rows||[]).map(function(r){ const o={}; cols.forEach(function(lbl,i){ if(!lbl) return; const c=r.c[i]; o[lbl]= c ? (c.v!=null?c.v:(c.f!=null?c.f:'')) : ''; }); return o; });
}

function parseTs(r){
  let t = Date.parse(String(r['Timestamp']||''));
  if (isNaN(t)) { const dli=String(r['Date Lead In']||'').slice(0,10); if(/^\d{4}-\d{2}-\d{2}$/.test(dli)) t=Date.parse(dli+'T00:00:00+08:00'); }
  return isNaN(t) ? 0 : t;
}

async function load(){
  if(myIdx()!==-1) document.getElementById('hTitle').textContent='📞 '+TELEMARKETERS[myIdx()]+' — Booking Chase';
  const list=document.getElementById('list'); list.innerHTML='<div class="spin">Scanning…</div>';
  document.getElementById('hSub').textContent='Scanning…';
  try {
    const [rows, st] = await Promise.all([ gvizRows(), api('phaseScanState',{}).catch(function(){return null;}) ]);
    STATE = (st && st.map) || {};
    const now = Date.now();
    DATA = []; NOPHONE = [];
    rows.forEach(function(r){
      const status = String(r['Status']||'').trim();
      if (OPEN_STATUSES.indexOf(status) === -1) return;               // booked or dead
      if (String(r['Date Appt Confirmed']||'').trim()) return;         // already has an appointment
      const ts = parseTs(r);
      const ageH = ts ? (now-ts)/3600000 : 999999;                    // unknown date -> treat as old
      if (ageH < AGE_MIN_H) return;                                    // too fresh, give them time
      const phone = String(r['Phone']||'').trim();
      if (isSuppressed(phone)) return;   // just cancelled here — hide while gviz catches up
      if (!myLead(phone)) return;        // not this telemarketer's share of the pool
      const c = {
        name: String(r['Name']||'').trim(),
        phone: phone,
        location: String(r['Location']||'').trim(),
        fullAddress: String(r['Full Address']||'').trim(),
        problem: String(r['Problem Type']||r['Slab or toilet leaking']||'').trim(),
        source: String(r['Source']||'').trim(),
        status: status,
        ageH: ts ? ageH : null
      };
      // Returning enquiry: this same phone was cancelled in a PRIOR cycle (a
      // Cancelled note dated before this lead's current lead-in). Notes are
      // phone-keyed, so a re-enquiry would otherwise look like a stuck
      // cancelled card — flag it so the caller knows it came back on its own.
      const _leadDate = String(r['Timestamp']||'').slice(0,10);
      const _notes = (STATE[last8(phone)]||{}).notes || [];
      let _pc='';
      _notes.forEach(function(n){ if(_leadDate && n.date && n.date < _leadDate && /cancel/i.test(n.note) && n.date>_pc) _pc=n.date; });
      c.reCancel = _pc;
      if (last8(phone).length >= 8) DATA.push(c); else NOPHONE.push(c);
    });
    DATA.sort(function(a,b){ return (a.ageH||1e9)-(b.ageH||1e9); });   // freshest (hottest) first
    render();
  } catch(e){
    list.innerHTML='<div class="allclear" style="color:#DC2626">⚠ Scan failed: '+esc(e.message||e)+'</div>';
    document.getElementById('hSub').textContent='Load failed.';
  }
}

function setSearch(v){ SEARCH=String(v||'').trim().toLowerCase(); render(); }
function match(c){
  if(!SEARCH) return true;
  const qd=SEARCH.replace(/\D/g,'');
  if(String(c.name||'').toLowerCase().indexOf(SEARCH)>=0) return true;
  if(String(c.location||'').toLowerCase().indexOf(SEARCH)>=0) return true;
  if(String(c.fullAddress||'').toLowerCase().indexOf(SEARCH)>=0) return true;
  if(qd && String(c.phone||'').replace(/\D/g,'').indexOf(qd)>=0) return true;
  return false;
}
function sortSnoozeLast(cards){
  return cards.slice().sort(function(a,b){
    const sa=snoozed(a)?1:0, sb=snoozed(b)?1:0;
    if(sa!==sb) return sa-sb;
    if(sa){ const da=(cardState(a)||{}).snoozeUntil||'', db=(cardState(b)||{}).snoozeUntil||''; return da<db?-1:(da>db?1:0); }
    return (a.ageH||1e9)-(b.ageH||1e9);
  });
}

let CARDIDX=0;
function render(){
  const list=document.getElementById('list');
  const inWin=function(c){ return match(c)&&winMatch(c); };
  const cards=sortSnoozeLast(DATA.filter(inWin));
  const active=cards.filter(function(c){return !snoozed(c);}).length;
  const np=NOPHONE.filter(inWin);
  const winLbl = WIN>=999 ? 'all ages' : ('≤'+WIN+'d');
  const who = myIdx()!==-1 ? (TELEMARKETERS[myIdx()]+' · ') : '';
  document.getElementById('hSub').textContent = who+active+' to chase ('+winLbl+')'+(np.length?(' · '+np.length+' no-phone'):'')+' · '+DATA.length+' eligible total'+(SEARCH?' · filtered':'');
  CARDIDX=0;
  let html='';
  if(cards.length){
    html += '<div class="sect-title">Un-booked · '+winLbl+' · '+cards.length+'</div>' + cards.map(cardHtml).join('');
  } else {
    html += '<div class="allclear">'+(SEARCH?'No match for “'+esc(SEARCH)+'”.':'✅ All caught up — no un-booked leads.')+'</div>';
  }
  if(np.length){
    html += '<div class="nophone"><div class="sect-title">⚠ No phone — can’t call/book ('+np.length+')</div>' + np.map(cardHtml).join('') + '</div>';
  }
  list.innerHTML=html;
}

function comp(label, ok){ return '<span class="chip '+(ok?'ok':'no')+'">'+label+(ok?' ✓':' ✗')+'</span>'; }

function cardHtml(c){
  const id='c'+(CARDIDX++); window['C_'+id]=c;
  const tel=String(c.phone||'').replace(/\D/g,'');
  const snz=snoozed(c); const snzUntil=snz?((cardState(c)||{}).snoozeUntil||''):'';
  const cold = c.ageH!=null && c.ageH>=168;   // 7d+ going cold
  const warm = c.ageH!=null && c.ageH>=72 && c.ageH<168;
  const cls='card'+(snz?' snz':(cold?' cold':(warm?' warm':'')));
  const waitCls='badge b-wait'+(cold?' cold':(warm?' warm':''));
  const hist=(cardState(c)||{}).notes||[];
  const histHtml = hist.length ? '<div class="hist"><div class="hist-h">📝 Notes</div>'+hist.map(function(n){ return '<div class="hist-row"><span class="hist-d">'+esc(n.date)+(n.by?' · '+esc(n.by):'')+'</span> '+esc(n.note)+'</div>'; }).join('')+'</div>' : '';
  const hasPhone = last8(c.phone).length>=8;
  return '<div class="'+cls+'" id="'+id+'">'+
    '<div class="cname">'+esc(c.name||'(no name)')+'</div>'+
    '<div class="badges">'+
      '<span class="badge b-status">'+esc(c.status)+'</span>'+
      (c.ageH!=null ? '<span class="'+waitCls+'">'+waitLabel(c.ageH)+' waiting</span>' : '<span class="badge b-wait cold">age ?</span>')+
      (c.location ? '<span class="badge b-loc">'+esc(c.location)+'</span>' : '')+
      (c.source ? '<span class="badge b-src">'+esc(c.source)+'</span>' : '')+
      (c.reCancel ? '<span class="badge b-ret">↩ returned · was cancelled '+esc(c.reCancel)+'</span>' : '')+
      (snz ? '<span class="badge b-snz">⏳ '+esc(snzUntil)+'</span>' : '')+
    '</div>'+
    '<div class="comp">'+
      comp('Name', !!c.name)+comp('Phone', hasPhone)+comp('Area', !!c.location)+comp('Address', !!c.fullAddress)+comp('Problem', !!c.problem)+
    '</div>'+
    (c.problem||c.fullAddress ? '<div class="meta">'+(c.problem?'<b>Problem:</b> '+esc(c.problem):'')+(c.problem&&c.fullAddress?'<br>':'')+(c.fullAddress?'<b>Addr:</b> '+esc(c.fullAddress):'')+'</div>' : '')+
    histHtml+
    '<div class="links">'+
      (tel ? '<a href="tel:'+tel+'" onclick="logCall(\''+id+'\')">📞 Call '+esc(c.phone)+'</a>' : '<span style="font-size:12px;color:#991B1B">no phone on file</span>')+
    '</div>'+
    '<div class="acts">'+
      (hasPhone ? (function(){
        var jb=leadIsJB(c);
        var kl='<button class="abtn book'+(jb?' alt':'')+'" onclick="bookLead(\''+id+'\',\'KL\')">📅 Book KL</button>';
        var jbb='<button class="abtn book'+(jb?'':' alt')+'" onclick="bookLead(\''+id+'\',\'JB\')">📅 Book JB</button>';
        return jb ? (jbb+kl) : (kl+jbb);   // likely team (solid) first
      })() : '')+
      (hasPhone ? '<button class="abtn edit" onclick="toggleP(\''+id+'\',\'ed\')">✏️ Complete details</button>' : '')+
      (hasPhone ? '<button class="abtn fu" onclick="toggleP(\''+id+'\',\'fu\')">📅 Follow-up</button>' : '')+
      (hasPhone ? '<button class="abtn nt" onclick="toggleP(\''+id+'\',\'nt\')">📝 Note</button>' : '')+
      '<button class="abtn cancel" onclick="toggleP(\''+id+'\',\'cx\')">❌ Cancel</button>'+
    '</div>'+
    (hasPhone ? '<div style="font-size:11px;color:#6b7280;margin-top:10px">Client skips site visit → move to:</div>'+
      '<div class="mv"><select id="'+id+'_mv">'+MOVE_PHASES.map(function(p){ return '<option value="'+esc(p)+'">→ '+esc(p)+'</option>'; }).join('')+'</select>'+
      '<button onclick="moveCard(\''+id+'\')">Move</button></div>' : '')+
    '<div class="panel cancel-p" id="'+id+'_cx">'+
      '<label>Remove this card — why?</label>'+
      '<button class="go" style="background:#EF4444" onclick="cancelCard(\''+id+'\',\'Lost\',\'wrong enquiry\')">🚫 Wrong enquiry / junk → Lost</button>'+
      '<button class="go" style="background:#B91C1C;margin-top:6px" onclick="cancelCard(\''+id+'\',\'Rejected\',\'already done\')">✅ Already done / handled → Rejected</button>'+
    '</div>'+
    '<div class="panel edit-p" id="'+id+'_ed">'+
      '<label>Name</label><input id="'+id+'_name" value="'+esc(c.name)+'">'+
      '<label>Area / State</label><input id="'+id+'_loc" list="states" value="'+esc(c.location)+'" placeholder="e.g. Selangor">'+
      '<label>Full address (the team needs this for the visit)</label><textarea id="'+id+'_addr" rows="2" placeholder="unit, street, postcode, city">'+esc(c.fullAddress)+'</textarea>'+
      '<label>Problem</label><input id="'+id+'_prob" value="'+esc(c.problem)+'" placeholder="e.g. roof leaking, wall seepage">'+
      '<button class="go" onclick="saveComplete(\''+id+'\')">Save to CRM</button>'+
    '</div>'+
    '<div class="panel fu-p" id="'+id+'_fu">'+
      '<label>Call back on (hides the card until then)</label>'+
      '<input type="date" id="'+id+'_fud" min="'+todayStr()+'" value="'+tomorrowStr()+'">'+
      '<label>📝 Note (traceable)</label><textarea id="'+id+'_fun" rows="2" placeholder="e.g. no answer, WhatsApp sent, call after 6pm"></textarea>'+
      '<button class="go" style="background:#F59E0B" onclick="saveFollowup(\''+id+'\')">Save follow-up</button>'+
    '</div>'+
    '<div class="panel nt-p" id="'+id+'_nt">'+
      '<label>📝 Note (traceable — card stays)</label><textarea id="'+id+'_ntn" rows="2" placeholder="log a note for this lead"></textarea>'+
      '<button class="go" style="background:#6B7280" onclick="saveNote(\''+id+'\')">Save note</button>'+
    '</div>'+
  '</div>';
}

// Likely team from the lead's own text — used to pre-highlight KL vs JB.
function leadIsJB(c){
  const s=(c.location||'')+' '+(c.fullAddress||'');
  return /(?:^|[^A-Za-z])(JB|JOHOR)(?:[^A-Za-z]|$)/i.test(s);
}
// Open the real booking page with an explicit team so it uses the right
// calendar/slots even when the lead has no Johor address on file yet
// (server would otherwise default to KL). team = 'KL' | 'JB'.
function bookLead(id, team){
  const c=window['C_'+id]; if(!c) return;
  const tel=String(c.phone||'').replace(/\D/g,'');
  window.open(BOOK_URL+'?p='+encodeURIComponent(tel)+'&team='+encodeURIComponent(team), '_blank');
  logChaseAct(c.phone, 'book', team);
  toast('Opened '+team+' booking — pick the slot, then Re-scan when done', 'ok');
}
// Log a call/book action to the Calls sheet for the daily report. Fire-and-
// forget; a small dedupe window swallows accidental double-taps on the same
// card. Attribution = BY (open the page as ?by=<name> per caller).
const _actSeen={};
function logChaseAct(phone, kind, team){
  const k=last8(phone)+'|'+kind;
  if(_actSeen[k] && Date.now()-_actSeen[k] < 8000) return;   // ignore double-tap
  _actSeen[k]=Date.now();
  api('logChaseAct', { phone:phone, by:BY, kind:kind, team:team||'' }).catch(function(){});
}
function logCall(id){ const c=window['C_'+id]; if(c) logChaseAct(c.phone, 'call'); }
function toggleP(id, which){
  ['ed','fu','nt','cx'].forEach(function(k){ const p=document.getElementById(id+'_'+k); if(p && k!==which) p.classList.remove('open'); });
  const t=document.getElementById(id+'_'+which); if(t) t.classList.toggle('open');
}
// Cancel a card off the chase list — 'Lost' (wrong enquiry) or 'Rejected'
// (already done). Sets the status (removes it from the open funnel) and logs
// the reason as a traceable note. Card greys out and drops on the next re-scan.
// Shift a card to a forward phase (e.g. Pending QT when the client skips the
// site inspection). Sets the status via the live updateStatus; the card then
// leaves the chase list.
async function moveCard(id){
  const c=window['C_'+id]; if(!c) return;
  const phase=document.getElementById(id+'_mv').value;
  if(!confirm('Move '+(c.name||'this lead')+' → '+phase+'?\n\n(Use when the client skips the site inspection.)')) return;
  const r=await api('updateStatus', { phone:c.phone, status:phase, changedBy:'Chase:'+BY });
  if(!r || r.status!=='ok'){ toast('Failed: '+((r&&r.message)||'error'),'err'); return; }
  suppress(c.phone);
  toast('Moved → '+phase+' ✓','ok');
  const el=document.getElementById(id); if(el) el.classList.add('gone');
}
async function cancelCard(id, status, reason){
  const c=window['C_'+id]; if(!c) return;
  if(!confirm('Remove '+(c.name||'this lead')+' from the chase list?\n\nReason: '+reason+'\nStatus → '+status)) return;
  const r=await api('updateStatus', { phone:c.phone, status:status, changedBy:'Chase:'+BY });
  if(!r || r.status!=='ok'){ toast('Failed: '+((r&&r.message)||'error'),'err'); return; }
  try { await api('logScanNote', { phone:c.phone, by:BY, note:'Cancelled ('+reason+') → '+status }); } catch(_e){}
  suppress(c.phone);   // keep it gone across refreshes while the sheet read catches up
  toast('Removed → '+status+' ✓','ok');
  const el=document.getElementById(id); if(el) el.classList.add('gone');
}
function pushNote(phone, note){
  const k=last8(phone); STATE[k]=STATE[k]||{notes:[],snoozeUntil:''}; STATE[k].notes=STATE[k].notes||[];
  if(note) STATE[k].notes.unshift({date:todayStr(), by:BY, note:note}); return STATE[k];
}
async function saveComplete(id){
  const c=window['C_'+id]; if(!c) return;
  const name=document.getElementById(id+'_name').value.trim();
  const loc=document.getElementById(id+'_loc').value.trim();
  const addr=document.getElementById(id+'_addr').value.trim();
  const prob=document.getElementById(id+'_prob').value.trim();
  const res=await api('updateLeadDetails', { phone:c.phone, name:name, location:loc, fullAddress:addr, problemType:prob, changedBy:'Chase:'+BY });
  if(res && res.status==='ok'){
    c.name=name; c.location=loc; c.fullAddress=addr; c.problem=prob;
    toast('Details saved ✓', 'ok'); render();
  } else { toast('Failed: '+((res&&res.message)||'error'), 'err'); }
}
async function saveFollowup(id){
  const c=window['C_'+id]; if(!c) return;
  const date=document.getElementById(id+'_fud').value;
  const note=document.getElementById(id+'_fun').value.trim();
  if(!date){ toast('Pick a date','err'); return; }
  const res=await api('logScanNote', { phone:c.phone, by:BY, followUpDate:date, note:note });
  if(res && res.status==='ok'){ toast('Call-back set → '+date+' ✓','ok'); pushNote(c.phone, note).snoozeUntil=date; render(); }
  else { toast('Failed: '+((res&&res.message)||'error'),'err'); }
}
async function saveNote(id){
  const c=window['C_'+id]; if(!c) return;
  const note=document.getElementById(id+'_ntn').value.trim();
  if(!note){ toast('Type a note','err'); return; }
  const res=await api('logScanNote', { phone:c.phone, by:BY, note:note });
  if(res && res.status==='ok'){ toast('Note saved ✓','ok'); pushNote(c.phone, note); render(); }
  else { toast('Failed: '+((res&&res.message)||'error'),'err'); }
}

// ===== Report view — daily calls/bookings performance monitor =====
let VIEW='chase';
let RDAYS=1;                 // 1 = single day, 7 = last week
let RDATE=todayStr();        // 'to' date (MYT)

function setView(v){
  VIEW=v;
  const isRep=(v==='report');
  document.getElementById('list').style.display=isRep?'none':'';
  document.getElementById('report').style.display=isRep?'':'none';
  document.getElementById('q').style.display=isRep?'none':'';
  document.querySelectorAll('.hdr .tools button[data-win]').forEach(function(b){ b.style.display=isRep?'none':''; });
  const rb=document.getElementById('repBtn');
  rb.textContent=isRep?'📞 Chase list':'📊 Report';
  rb.onclick=function(){ setView(isRep?'chase':'report'); };
  if(isRep) loadReport(); else load();
}
function refreshView(){ VIEW==='report'?loadReport():load(); }
function setRDays(d){ RDAYS=d; loadReport(); }
function setRDate(v){ if(v){ RDATE=v; loadReport(); } }

async function loadReport(){
  const el=document.getElementById('report');
  el.innerHTML='<div class="spin">Loading report…</div>';
  document.getElementById('hSub').textContent='Report';
  try{
    const r=await api('chaseReport', { date:RDATE, days:RDAYS });
    if(!r || r.status!=='ok'){ el.innerHTML='<div class="allclear" style="color:#DC2626">⚠ '+esc((r&&r.message)||'report failed')+'</div>'; return; }
    renderReport(r);
  }catch(e){ el.innerHTML='<div class="allclear" style="color:#DC2626">⚠ '+esc(e.message||e)+'</div>'; }
}

function kicon(k){ return k==='book'?'📅':'📞'; }
function renderReport(r){
  const el=document.getElementById('report');
  const T=r.totals||{calls:0,books:0,confirmed:0};
  document.getElementById('hSub').textContent = 'Report · '+(RDAYS>1?(r.from+' → '+r.to):r.to);

  // aggregate people across the range
  const pmap={};
  (r.days||[]).forEach(function(d){ (d.byPersonList||[]).forEach(function(p){
    const a=pmap[p.name]||(pmap[p.name]={name:p.name,calls:0,books:0,confirmed:0});
    a.calls+=p.calls; a.books+=p.books; a.confirmed+=p.confirmed;
  }); });
  const people=Object.keys(pmap).map(function(k){return pmap[k];}).sort(function(a,b){return b.books-a.books||b.calls-a.calls;});

  let h='';
  h+='<div class="rep-ctrl">'+
       '<button class="'+(RDAYS===1?'on':'')+'" onclick="setRDays(1)">Single day</button>'+
       '<button class="'+(RDAYS===7?'on':'')+'" onclick="setRDays(7)">Last 7 days</button>'+
       '<input type="date" value="'+esc(RDATE)+'" max="'+esc(todayStr())+'" onchange="setRDate(this.value)">'+
       '<button onclick="loadReport()">↻</button>'+
     '</div>';

  h+='<div class="tiles">'+
       '<div class="tile call"><div class="n">'+T.calls+'</div><div class="l">Calls made</div></div>'+
       '<div class="tile book"><div class="n">'+T.books+'</div><div class="l">Bookings</div></div>'+
       '<div class="tile conf"><div class="n">'+T.confirmed+'</div><div class="l">Confirmed</div></div>'+
     '</div>'+
     '<div class="rep-legend">📅 <b>Bookings</b> = site-visit bookings made via the Chase page + Express staff links · ✅ <b>Confirmed</b> = lead now has a site-visit appointment on the calendar.</div>';

  if(!T.calls && !T.books){
    h+='<div class="allclear" style="padding:30px 20px;color:#6b7280">No call or booking activity logged for this '+(RDAYS>1?'period':'day')+'.</div>';
    if(BY==='Chase') h+=attrNote();
    el.innerHTML=h; return;
  }

  // per-person
  h+='<table class="rtbl"><tr><th>Team member</th><th class="num">📞 Calls</th><th class="num">📅 Bookings</th><th class="num">✅ Confirmed</th></tr>';
  h+=people.map(function(p){ return '<tr><td>'+esc(p.name)+'</td><td class="num">'+p.calls+'</td><td class="num">'+p.books+'</td><td class="num">'+p.confirmed+'</td></tr>'; }).join('');
  h+='</table>';

  // per-day breakdown (only when range)
  if(RDAYS>1 && (r.days||[]).length){
    h+='<table class="rtbl"><tr><th>Day</th><th class="num">Calls</th><th class="num">Bookings</th><th class="num">Confirmed</th></tr>';
    h+=r.days.map(function(d){ return '<tr><td>'+esc(d.date)+'</td><td class="num">'+d.calls+'</td><td class="num">'+d.books+'</td><td class="num">'+d.confirmed+'</td></tr>'; }).join('');
    h+='</table>';
  }

  // detail listing grouped by day
  (r.days||[]).forEach(function(d){
    h+='<div class="day-h"><span>'+esc(d.date)+'</span><span class="s">'+d.calls+' calls · '+d.books+' bookings · '+d.confirmed+' confirmed</span></div>';
    h+=(d.items||[]).map(function(it){
      const sub=[esc(it.phone)]; if(it.note) sub.push(esc(it.note));
      return '<div class="evt b-'+it.kind+(it.dup?' dup':'')+'">'+
        '<span class="t">'+esc(it.time||'')+'</span>'+
        '<span class="k">'+kicon(it.kind)+'</span>'+
        '<span class="b"><span class="nm">'+esc(it.name||'(no name)')+
          (it.kind==='book'&&it.src?'<span class="src-tag '+it.src+'">'+(it.src==='express'?'Express':'Chase')+'</span>':'')+
          (it.dup?'<span class="dup-tag">duplicate · not counted</span>':(it.kind==='book'&&it.confirmed?'<span class="conf-tag">appt set ✓</span>':''))+'</span>'+
        '<span class="sub">'+sub.join(' · ')+'</span></span>'+
        '<span class="who">'+esc(it.by)+'</span>'+
      '</div>';
    }).join('');
  });

  if(BY==='Chase') h+=attrNote();
  el.innerHTML=h;
}
function attrNote(){
  return '<div style="font-size:12px;color:#6b7280;background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:10px 12px;margin-top:8px;line-height:1.5">'+
    '💡 Activity is showing as <b>“Chase”</b> because the page was opened without a name. Give each team member a link like '+
    '<code>?by=Ken</code> (e.g. <code>…/booking_chase.html?by=Ken</code>) so calls &amp; bookings are credited per person.</div>';
}

load();
</script>
