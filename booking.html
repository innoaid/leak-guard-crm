<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=/appointment/">
<title>Leak Guard — Book Site Visit</title>
<script>
// Preserve query string when redirecting (so ?p=PHONE etc. carry over)
(function(){
  var qs = window.location.search || '';
  var hash = window.location.hash || '';
  window.location.replace('/appointment/' + qs + hash);
})();
</script>
<style>body{font-family:system-ui,sans-serif;text-align:center;padding:40px;color:#6b6960}</style>
</head>
<body>
<p>Redirecting to <a href="/appointment/">/appointment/</a>…</p>
</body>
</html>
