<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Leak Guard — Job Track Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;color:#111827;font-size:15px;padding:0 0 48px}
.hdr{background:#0F2A4A;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.hdr .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr h1{font-size:18px;font-weight:800;letter-spacing:.2px}
.hdr h1 .pro{color:#38BDF8}
.hdr .sub{font-size:12px;opacity:.82;margin-top:3px}
.hdr .who{font-size:11px;opacity:.7}
.hdr .who a{color:#BAE6FD;cursor:pointer;text-decoration:underline;margin-left:7px}
.rfs{background:#1E3A5F;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;padding:7px 12px;cursor:pointer;flex-shrink:0}
.rfs:disabled{opacity:.5;cursor:default}
.back{background:none;border:none;color:#BAE6FD;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;margin-bottom:4px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.card.flat{cursor:default}
.cname{font-size:16px;font-weight:800}
.meta{font-size:12.5px;color:#6b7280;margin-top:4px;line-height:1.5}
.meta b{color:#374151}
.pill{display:inline-block;font-weight:700;font-size:11.5px;padding:2px 9px;border-radius:9px;margin:5px 6px 0 0;border:1px solid}
.pill.st{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.pill.qc{background:#F0FDFA;color:#0F766E;border-color:#99F6E4}
.pill.sub{background:#FEF9C3;color:#854D0E;border-color:#FDE68A}
.pill.cap{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}
.prog{margin-top:11px}
.prog .bar{height:8px;background:#E5E7EB;border-radius:6px;overflow:hidden}
.prog .fill{height:100%;background:#10B981;border-radius:6px;transition:width .25s}
.prog .lbl{font-size:12px;font-weight:700;color:#6B7280;margin-bottom:5px;display:flex;justify-content:space-between}
.prog .lbl b{color:#111827}
.srch{width:100%;border:1px solid #D1D5DB;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;margin-bottom:12px}
.tabs{display:flex;gap:4px;margin:14px 0 2px}
.tab{flex:1;background:#fff;border:1px solid #e5e7eb;color:#6B7280;font-family:inherit;font-size:13px;font-weight:700;padding:10px 4px;cursor:pointer;border-radius:10px}
.tab.on{color:#0F2A4A;border-color:#0F2A4A;background:#EFF6FF}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#9CA3AF;margin:4px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F4F6}
.row:last-child{border-bottom:none}
.ticon{width:30px;height:30px;border-radius:8px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tbody{flex:1;min-width:0}
.ttitle{font-size:13.5px;font-weight:700;line-height:1.35}
.tmeta{font-size:11px;color:#9CA3AF;margin-top:2px}
.tright{display:flex;gap:6px;align-items:center;flex-shrink:0}
select.sstat{font-family:inherit;font-size:12px;font-weight:700;border:1px solid #D1D5DB;border-radius:8px;padding:5px 7px;background:#fff;color:#111827;cursor:pointer}
select.sstat.verified{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}
select.sstat.pending{background:#FFFBEB;color:#B45309;border-color:#FDE68A}
select.sstat.doing{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.pcam{font-size:12px;color:#2563EB;border:1px solid #BFDBFE;background:#EFF6FF;border-radius:7px;padding:5px 9px;font-family:inherit;font-weight:700;cursor:pointer}
.pview{font-size:12px;text-decoration:none;color:#065F46;border:1px solid #A7F3D0;background:#ECFDF5;border-radius:7px;padding:5px 9px;font-weight:700}
.tdel{font-size:14px;color:#9CA3AF;border:none;background:none;cursor:pointer;padding:3px}
.dd dt{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#9CA3AF;font-weight:700;margin-top:11px}
.dd dd{font-size:14px;font-weight:600;margin-top:2px}
.links{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
.lk{font-size:12.5px;text-decoration:none;border-radius:8px;padding:7px 12px;border:1px solid;cursor:pointer;font-family:inherit;background:#fff}
.lk.wa{color:#166534;border-color:#BBF7D0;background:#F0FDF4}
.lk.tel{color:#2563EB;border-color:#BFDBFE;background:#EFF6FF}
.addbar{display:flex;gap:7px;margin-top:10px}
.addbar select,.addbar input{font-family:inherit;font-size:13px;border:1px solid #D1D5DB;border-radius:9px;padding:9px}
.addbar input{flex:1;min-width:0}
.addbar .btn{background:#0F2A4A;color:#fff;border:none;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.statusbox{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:1px solid #E5E7EB;border-radius:10px;padding:10px 12px}
.statusbox .t{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#9CA3AF;font-weight:700}
.statusbox select{font-family:inherit;font-size:14px;font-weight:700;border:1px solid #D1D5DB;border-radius:9px;padding:7px 9px;background:#fff;flex:1}
.empty{text-align:center;color:#6b7280;padding:54px 20px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:opacity .25s;max-width:90%;text-align:center}
.toast.on{opacity:1}.toast.err{background:#DC2626}.toast.ok{background:#059669}
/* login */
.loginwrap{position:fixed;inset:0;background:#0F2A4A;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.loginbox{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.loginbox h2{font-size:22px;font-weight:800;text-align:center}
.loginbox h2 span{color:#2563EB}
.loginbox p{text-align:center;color:#6B7280;font-size:13px;margin:4px 0 18px}
.loginbox input{width:100%;border:1px solid #D1D5DB;border-radius:10px;padding:12px;font-family:inherit;font-size:15px;margin-bottom:10px}
.loginbox button{width:100%;background:#0F2A4A;color:#fff;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.loginbox button:disabled{opacity:.6}
.lerr{color:#DC2626;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div class="loginwrap" id="login" style="display:none">
  <form class="loginbox" onsubmit="doLogin(event)">
    <h2>Job <span>Track Pro</span></h2>
    <p>Sign in with your CRM login</p>
    <input id="luser" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="lpin" type="password" placeholder="PIN" autocomplete="current-password" inputmode="numeric">
    <button type="submit" id="lbtn">Sign in</button>
    <div class="lerr" id="lerr"></div>
  </form>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="top">
      <div>
        <button class="back" id="backBtn" style="display:none" onclick="goList()">‹ All jobs</button>
        <h1>Job <span class="pro">Track Pro</span></h1>
      </div>
      <button class="rfs" id="refreshBtn" onclick="refresh()">↻ Refresh</button>
    </div>
    <div class="sub" id="hSub">Loading…</div>
    <div class="who" id="who"></div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<div class="toast" id="toast"></div>
<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxjWM_kuuFvXhgPgoSEb4hycnIUHuxdOkYTfSWEhNPm7vrOYzZ6vFgQw-qA55Dv3mLB2Q/exec';
const SECRET='ABC';
const SHEET_ID='1FnuiZcOSy5UMQpW81I7qtU6a7NGlnHtJbH2EkVM7PLQ';
const SHEET_NAME='Leak Guard Leads';
// Fulfillment phases JTP shows (must match JTP_STATUSES in ops.gs). Capture point = Pending I.Date.
const JTP_STATUSES=['Pending I.Date','Pending Downpayment','I.Date Confirmed','Job In Progress','Job Complete','Pending Balance','Receipt Sent'];
const JTP_SET_STATUSES=JTP_STATUSES.concat(['Completed']);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TSTATE=[['open','Open'],['doing','In progress'],['pending','Pending verify'],['verified','Verified ✓']];
const TTYPE_ICON={check:'☑️',photo:'📷',signoff:'✍️'};
const TTYPE_LBL={check:'Checklist',photo:'Photo',signoff:'Sign-off'};
const SKEY='jtp_session';

let SESSION=null, BY='';
let LIST={jobs:[],today:''};
let CUR=null;                 // reference to the current job inside LIST.jobs
let VIEW='list', TAB='overview', QUERY='';

function toast(m,k){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast on '+(k||''); setTimeout(function(){ t.className='toast '+(k||''); },2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
function js(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' '); }
function digits(p){ let s=String(p==null?'':p); if(s.indexOf('.')>=0) s=s.replace(/\.0+$/,''); return s.replace(/\D/g,''); }
function fmt(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return d||''; return (+m[3])+' '+MONTHS[(+m[2])-1]; }
function todayStr(){ const d=new Date(Date.now()+8*3600*1000); return d.toISOString().slice(0,10); }
function pct(p){ const t=(p&&p.total)||0, d=(p&&p.done)||0; return t?Math.round(d*100/t):0; }
function prog(tasks){ let d=0; (tasks||[]).forEach(function(t){ if(t&&t.status==='verified') d++; }); return {done:d,total:(tasks||[]).length}; }
async function api(action,payload){
  const r=await fetch(APPS_SCRIPT_URL,{ method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(Object.assign({action:action,secret:SECRET},payload)) });
  return r.json();
}

// ---------------- session / login ----------------
function getSession(){ try{ const s=JSON.parse(localStorage.getItem(SKEY)||'null'); if(s&&s.name&&(Date.now()-(s.at||0))<12*3600*1000) return s; }catch(_e){} return null; }
function setSession(s){ SESSION=s; BY=s.name; try{ localStorage.setItem(SKEY,JSON.stringify({name:s.name,role:s.role,at:Date.now()})); }catch(_e){} }
function logout(){ try{ localStorage.removeItem(SKEY); }catch(_e){} location.hash=''; location.reload(); }
async function doLogin(ev){
  ev.preventDefault();
  const u=(document.getElementById('luser').value||'').trim();
  const p=(document.getElementById('lpin').value||'').trim();
  const err=document.getElementById('lerr'); const btn=document.getElementById('lbtn');
  if(!u||!p){ err.textContent='Enter username and PIN'; return; }
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  try{
    const res=await api('login',{ username:u, pin:p });
    if(!res||res.status!=='ok'){ err.textContent=(res&&res.message==='invalid')?'Wrong username or PIN':((res&&res.message)||'Login failed'); btn.disabled=false; btn.textContent='Sign in'; return; }
    setSession({ name:res.name||u, role:res.role||'' });
    startApp();
  }catch(e){ err.textContent='Network error — try again'; btn.disabled=false; btn.textContent='Sign in'; }
}
function showLogin(){ document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex'; setTimeout(function(){ const el=document.getElementById('luser'); if(el) el.focus(); },50); }

// ---------------- routing ----------------
function parseHash(){ const m=String(location.hash||'').match(/j=([^&]+)/); return m?decodeURIComponent(m[1]):''; }
function goList(){ if(location.hash){ location.hash=''; } else route(); }
function openJob(phone){ location.hash='j='+encodeURIComponent(digits(phone)); }
window.addEventListener('hashchange',function(){ if(SESSION) route(); });
function route(){ const phone=parseHash(); if(phone){ showJob(phone); } else { showList(); } }

// ---------------- fast read via gviz (no Apps Script queue) ----------------
async function loadSheet(){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(SHEET_NAME)+'&nocache='+Date.now();
  const txt=await (await fetch(url)).text();
  const m=txt.match(/setResponse\(([\s\S]*)\)/); if(!m) throw new Error('read failed');
  const j=JSON.parse(m[1]);
  const cols=j.table.cols.map(function(c){ return (c.label||'').trim(); });
  const want=['Phone','Name','Full Address','Location','Status','Group Invite Link (AJ)','Installation Date','Expected Completion Date','Assigned QC Team','Assigned Subcon Team','Problem Type','Quotation (RM)','Tasks','JTP Active'];
  const ix={}; want.forEach(function(n){ ix[n]=cols.indexOf(n); });
  const V=function(r,n){ const i=ix[n]; if(i<0) return ''; const c=r.c[i]; return c?String(c.v!=null?c.v:(c.f||'')):''; };
  const normD=function(v){ const s=String(v||''); let mm=s.match(/^Date\((\d+),(\d+),(\d+)/); if(mm){ const p=function(n){return(n<10?'0':'')+n;}; return mm[1]+'-'+p((+mm[2])+1)+'-'+p(+mm[3]); } mm=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return mm?mm[0]:''; };
  const parseTasks=function(v){ try{ const a=JSON.parse(String(v||'')||'[]'); return Array.isArray(a)?a:[]; }catch(_e){ return []; } };
  const jobs=[];
  (j.table.rows||[]).forEach(function(r){
    if(!r||!r.c) return;
    const status=V(r,'Status').trim();
    if(JTP_STATUSES.indexOf(status)===-1) return;
    const phone=digits(V(r,'Phone')); if(!phone) return;
    const tasks=parseTasks(V(r,'Tasks'));
    jobs.push({
      name:V(r,'Name').trim(), phone:phone,
      address:(V(r,'Full Address').trim()||V(r,'Location').trim()),
      status:status, groupLink:V(r,'Group Invite Link (AJ)').trim(),
      instDate:normD(V(r,'Installation Date')), expComplete:normD(V(r,'Expected Completion Date')),
      qcTeam:V(r,'Assigned QC Team').trim(), subcon:V(r,'Assigned Subcon Team').trim(),
      problem:V(r,'Problem Type').trim(), rm:V(r,'Quotation (RM)').trim(),
      tasks:tasks, captured:!!V(r,'JTP Active').trim(), progress:prog(tasks)
    });
  });
  jobs.sort(function(a,b){ return String(a.instDate||'9999').localeCompare(String(b.instDate||'9999')); });
  LIST={jobs:jobs,today:todayStr()};
}
function findJob(phone){ const d=digits(phone); for(let i=0;i<LIST.jobs.length;i++){ if(digits(LIST.jobs[i].phone)===d) return LIST.jobs[i]; } return null; }

async function refresh(){
  const rb=document.getElementById('refreshBtn'); if(rb) rb.disabled=true;
  document.getElementById('hSub').textContent='Loading…';
  try{ await loadSheet(); if(VIEW==='job'&&CUR){ const j=findJob(CUR.phone); if(j){ CUR=j; renderJob(); } } route(); }
  catch(e){ document.getElementById('hSub').textContent='Load failed — tap ↻ Refresh.'; }
  finally{ if(rb) rb.disabled=false; }
}

// ---------------- list ----------------
function showList(){
  VIEW='list'; CUR=null;
  document.getElementById('backBtn').style.display='none';
  const total=LIST.jobs.length;
  document.getElementById('hSub').textContent=total+' job'+(total===1?'':'s')+' in fulfillment';
  const v=document.getElementById('view');
  if(!total){ v.innerHTML='<div class="empty">No jobs in installation yet.<br>Jobs appear here once a kanban card reaches <b>Pending I.Date</b>.</div>'; return; }
  const q=QUERY.toLowerCase().trim();
  const rows=LIST.jobs.filter(function(j){ if(!q) return true; return ((j.name||'')+' '+(j.phone||'')+' '+(j.address||'')+' '+(j.status||'')).toLowerCase().indexOf(q)>=0; });
  v.innerHTML='<input class="srch" id="srch" placeholder="Search name / address / status…" value="'+esc(QUERY)+'" oninput="onSearch(this.value)">'+
    (rows.length?rows.map(listCard).join(''):'<div class="empty">No match for “'+esc(QUERY)+'”.</div>');
  const s=document.getElementById('srch'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
}
function onSearch(v){ QUERY=v; const q=v.toLowerCase().trim();
  // filter in place without losing focus
  const cards=document.querySelectorAll('[data-ph]');
  cards.forEach(function(el){ const hay=el.getAttribute('data-hay'); el.style.display=(!q||hay.indexOf(q)>=0)?'':'none'; });
}
function listCard(j){
  const p=pct(j.progress);
  const hay=((j.name||'')+' '+(j.phone||'')+' '+(j.address||'')+' '+(j.status||'')).toLowerCase();
  return '<div class="card" data-ph="'+esc(j.phone)+'" data-hay="'+esc(hay)+'" onclick="openJob(\''+js(j.phone)+'\')">'+
    '<div class="cname">'+esc(j.name||'(no name)')+'</div>'+
    (j.address?'<div class="meta">📍 '+esc(j.address)+'</div>':'')+
    '<div>'+
      '<span class="pill st">'+esc(j.status)+'</span>'+
      (j.qcTeam?'<span class="pill qc">🧰 '+esc(j.qcTeam)+'</span>':'')+
      (j.subcon?'<span class="pill sub">👷 '+esc(j.subcon)+'</span>':'')+
      (j.captured?'<span class="pill cap">✓ in JTP</span>':'')+
    '</div>'+
    (j.instDate?'<div class="meta" style="margin-top:7px">🗓️ '+esc(fmt(j.instDate))+(j.expComplete?' → <b>'+esc(fmt(j.expComplete))+'</b>':'')+'</div>':'')+
    '<div class="prog"><div class="lbl"><span>'+((j.progress&&j.progress.done)||0)+' / '+((j.progress&&j.progress.total)||0)+' verified</span><b>'+p+'%</b></div>'+
    '<div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div>'+
  '</div>';
}

// ---------------- job ----------------
async function showJob(phone){
  VIEW='job';
  document.getElementById('backBtn').style.display='';
  const j=findJob(phone);
  if(!j){ document.getElementById('view').innerHTML='<div class="empty">Job not found — tap ‹ All jobs.</div>'; document.getElementById('hSub').textContent=''; return; }
  CUR=j; document.getElementById('hSub').textContent=esc(j.name||digits(phone));
  renderJob();
  // capture (seed tasks) only when the job hasn't been captured yet — one Apps Script call, first open only
  if(!CUR.tasks||!CUR.tasks.length){
    try{
      const res=await api('jtpJob',{ phone:CUR.phone, by:BY });
      if(res&&res.status==='ok'&&res.job){ CUR.tasks=res.job.tasks||[]; CUR.captured=true; CUR.progress=res.job.progress||prog(CUR.tasks); if(res.job.captured) toast('Captured into Job Track Pro ✓','ok'); renderJob(); }
    }catch(e){ /* leave empty; user can refresh */ }
  }
}
function setTab(t){ TAB=t; renderJob(); window.scrollTo(0,0); }
function renderJob(){
  if(!CUR) return;
  const p=pct(CUR.progress);
  const header='<div class="card flat">'+
    '<div class="cname">'+esc(CUR.name||'(no name)')+'</div>'+
    (CUR.address?'<div class="meta">📍 '+esc(CUR.address)+'</div>':'')+
    '<div class="prog"><div class="lbl"><span>'+((CUR.progress&&CUR.progress.done)||0)+' / '+((CUR.progress&&CUR.progress.total)||0)+' tasks verified</span><b>'+p+'%</b></div>'+
    '<div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div>'+
  '</div>';
  const tabs='<div class="tabs">'+
    '<button class="tab'+(TAB==='overview'?' on':'')+'" onclick="setTab(\'overview\')">Overview</button>'+
    '<button class="tab'+(TAB==='tasks'?' on':'')+'" onclick="setTab(\'tasks\')">Tasks</button>'+
  '</div>';
  document.getElementById('view').innerHTML=header+tabs+(TAB==='overview'?overviewTab():tasksTab());
}
function overviewTab(){
  const opts=JTP_SET_STATUSES.map(function(s){ return '<option value="'+esc(s)+'"'+(s===CUR.status?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
  const tel=digits(CUR.phone);
  let links='<div class="links">';
  if(tel) links+='<a class="lk tel" href="tel:'+tel+'">📞 Call</a>';
  if(CUR.groupLink) links+='<a class="lk wa" href="'+esc(CUR.groupLink)+'" target="_blank" rel="noopener">💬 WA group</a>';
  links+='</div>';
  return '<div class="card flat">'+
    '<div class="statusbox"><span class="t">Status</span><select onchange="setStatus(this.value)">'+opts+'</select></div>'+
    '<dl class="dd">'+
      (CUR.instDate?'<dt>Installation</dt><dd>'+esc(fmt(CUR.instDate))+(CUR.expComplete?' → '+esc(fmt(CUR.expComplete)):'')+'</dd>':'')+
      (CUR.qcTeam?'<dt>QC team</dt><dd>'+esc(CUR.qcTeam)+'</dd>':'')+
      (CUR.subcon?'<dt>Subcon crew</dt><dd>'+esc(CUR.subcon)+'</dd>':'')+
      (CUR.problem?'<dt>Scope</dt><dd>'+esc(CUR.problem)+'</dd>':'')+
      (CUR.rm?'<dt>Quotation</dt><dd>RM '+esc(CUR.rm)+'</dd>':'')+
    '</dl>'+links+
  '</div>';
}
function tasksTab(){
  const rows=(CUR.tasks||[]).map(taskRow).join('')||'<div class="meta">No tasks yet.</div>';
  const add='<div class="addbar">'+
    '<select id="ntype"><option value="check">☑️ Checklist</option><option value="photo">📷 Photo</option><option value="signoff">✍️ Sign-off</option></select>'+
    '<input id="ntitle" placeholder="New task title…">'+
    '<button class="btn" onclick="addTask()">Add</button>'+
  '</div>';
  return '<div class="card flat"><div class="sec"><h4>Tasks</h4>'+rows+'</div>'+add+'</div>';
}
function taskRow(t){
  const opts=TSTATE.map(function(s){ return '<option value="'+s[0]+'"'+(s[0]===t.status?' selected':'')+'>'+s[1]+'</option>'; }).join('');
  let right='<div class="tright">';
  if(t.type==='photo'){
    if(t._uploading) right+='<span class="tmeta">⏳ uploading…</span>';
    else{
      right+='<button class="pcam" onclick="pickPhoto(\''+js(t.id)+'\')">📷</button>';
      if(t.photoUrl) right+='<a class="pview" href="'+esc(t.photoUrl)+'" target="_blank" rel="noopener">view</a>';
    }
  }
  right+='<select class="sstat '+esc(t.status)+'" onchange="setTaskStatus(\''+js(t.id)+'\',this.value)">'+opts+'</select>';
  right+='<button class="tdel" title="Remove task" onclick="delTask(\''+js(t.id)+'\')">✕</button></div>';
  return '<div class="row">'+
    '<div class="ticon">'+(TTYPE_ICON[t.type]||'•')+'</div>'+
    '<div class="tbody"><div class="ttitle">'+esc(t.title)+'</div>'+
      '<div class="tmeta">'+esc(TTYPE_LBL[t.type]||t.type)+(t.verifiedBy?(' · verified by '+esc(t.verifiedBy)):'')+'</div></div>'+
    right+
  '</div>';
}
function findTask(id){ const a=CUR&&CUR.tasks||[]; for(let i=0;i<a.length;i++){ if(String(a[i].id)===String(id)) return {t:a[i],i:i}; } return null; }
function recalc(){ CUR.progress=prog(CUR.tasks); }

// ---------------- actions (optimistic; writes return fresh state) ----------------
async function setStatus(status){
  if(!CUR) return; const prev=CUR.status; CUR.status=status; renderJob();
  try{ const res=await api('jtpSetStatus',{ phone:CUR.phone, status:status, by:BY }); if(!res||res.status!=='ok') throw new Error((res&&res.message)||'Failed'); toast('Status → '+status,'ok'); }
  catch(e){ CUR.status=prev; renderJob(); toast(String(e.message||e),'err'); }
}
async function setTaskStatus(id,status){
  const f=findTask(id); if(!f) return; const pv=f.t.status, pb=f.t.verifiedBy;
  f.t.status=status; f.t.verifiedBy=(status==='verified')?(BY||f.t.verifiedBy||''):''; recalc(); renderJob();
  try{ const res=await api('jtpTaskUpdate',{ phone:CUR.phone, taskId:id, patch:{status:status}, by:BY }); if(!res||res.status!=='ok') throw new Error((res&&res.message)||'Failed'); CUR.tasks=res.tasks; CUR.progress=res.progress; renderJob(); }
  catch(e){ f.t.status=pv; f.t.verifiedBy=pb; recalc(); renderJob(); toast(String(e.message||e),'err'); }
}
async function addTask(){
  const type=(document.getElementById('ntype')||{}).value||'check';
  const title=((document.getElementById('ntitle')||{}).value||'').trim();
  if(!title){ toast('Enter a task title','err'); return; }
  try{ const res=await api('jtpTaskAdd',{ phone:CUR.phone, type:type, title:title, by:BY }); if(!res||res.status!=='ok') throw new Error((res&&res.message)||'Failed'); CUR.tasks=res.tasks; CUR.progress=res.progress; renderJob(); toast('Task added','ok'); }
  catch(e){ toast(String(e.message||e),'err'); }
}
async function delTask(id){
  if(!confirm('Remove this task?')) return;
  const f=findTask(id); if(!f) return; const removed=CUR.tasks.splice(f.i,1)[0]; recalc(); renderJob();
  try{ const res=await api('jtpTaskDelete',{ phone:CUR.phone, taskId:id }); if(!res||res.status!=='ok') throw new Error((res&&res.message)||'Failed'); CUR.tasks=res.tasks; CUR.progress=res.progress; renderJob(); }
  catch(e){ CUR.tasks.splice(f.i,0,removed); recalc(); renderJob(); toast(String(e.message||e),'err'); }
}
// ---------------- photo upload ----------------
function pickPhoto(id){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment'); inp.onchange=function(){ const file=inp.files&&inp.files[0]; if(file) uploadPhoto(id,file); }; inp.click(); }
function compressImage(file,maxDim,quality){
  return new Promise(function(resolve,reject){
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=function(){ let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height; const s=Math.min(1,maxDim/Math.max(w,h||1)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s)); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); try{ resolve(cv.toDataURL('image/jpeg',quality)); }catch(err){ reject(err); } };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
    img.src=url;
  });
}
async function uploadPhoto(id,file){
  const f=findTask(id); if(!f) return; let dataUrl;
  try{ toast('Preparing photo…'); dataUrl=await compressImage(file,1280,0.72); }catch(e){ toast(String(e.message||e),'err'); return; }
  const ps=f.t.status, pu=f.t.photoUrl; f.t._uploading=true; if(f.t.status==='open'||f.t.status==='doing') f.t.status='pending'; renderJob();
  try{ const res=await api('jtpUploadPhoto',{ phone:CUR.phone, taskId:id, dataUrl:dataUrl, by:BY }); if(!res||res.status!=='ok') throw new Error((res&&res.message)||'Upload failed'); CUR.tasks=res.tasks; CUR.progress=res.progress; const nf=findTask(id); if(nf) nf.t._uploading=false; renderJob(); toast('Photo uploaded ✓','ok'); }
  catch(e){ f.t._uploading=false; f.t.status=ps; f.t.photoUrl=pu; renderJob(); toast(String(e.message||e),'err'); }
}

// ---------------- boot ----------------
async function startApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('who').innerHTML='Signed in as <b>'+esc(SESSION.name)+'</b><a onclick="logout()">Log out</a>';
  document.getElementById('hSub').textContent='Loading…';
  try{ await loadSheet(); }catch(e){ document.getElementById('hSub').textContent='Load failed — tap ↻ Refresh.'; }
  route();
}
(function(){ SESSION=getSession(); if(SESSION){ BY=SESSION.name; startApp(); } else { showLogin(); } })();
</script>
